# Host-level vhost, installed as /etc/nginx/sites-available/game-hub.joura.info.
# The host only does TLS and hands everything to the web container on loopback.
# Certbot adds the certificate lines and the port 80 redirect on first run.

server {
    listen 80;
    listen [::]:80;
    server_name game-hub.joura.info;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for /ws and /ws/race. The web container decides whether
        # a request is really an upgrade, so this hop can forward the headers unconditionally
        # (and it avoids depending on a map defined in some other site's config).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
