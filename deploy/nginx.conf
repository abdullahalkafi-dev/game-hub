# Runs inside the "web" container. It has two jobs:
#   1. serve the compiled client (static files)
#   2. forward /api and /ws to the game server container

# Lets the proxy block below send "Upgrade" only when the browser asked for a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Explicit so glTF models and wasm are never served as octet-stream.
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
        application/wasm  wasm;
    }

    # Vite puts a content hash in these file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must never be cached, otherwise players keep an old bundle after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:2567;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://server:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Matches stay open for a long time and idle lobbies send nothing, so keep sockets alive.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
