# Runs inside the "web" container. It has two jobs:
#   1. serve the compiled client (static files)
#   2. forward /api and /ws to the game server container

# Lets the proxy block below send "Upgrade" only when the browser asked for a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Vite bundles carry a content hash in the name (index-De6sZEJW.js), so they can be cached forever.
    # Everything else under /assets/ (models, audio, textures) keeps a stable name and is
    # only revalidated, otherwise a changed model would be stuck in browsers for a year.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must never be cached, otherwise players keep an old bundle after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Private weapon-model upload page and its API (see docs/09-admin-uploads.md). Uploads are large and
    # stream straight through, so no request buffering and a long timeout.
    location = /admin {
        proxy_pass http://server:2567;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin/ {
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_pass http://server:2567;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }

    location /api/ {
        proxy_pass http://server:2567;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://server:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Matches stay open for a long time and idle lobbies send nothing, so keep sockets alive.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
